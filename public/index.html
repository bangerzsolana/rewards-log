<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rewards — Gib Meme</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'LuckiestGuy';
      src: url('/assets/fonts/LuckiestGuy-Regular.ttf') format('truetype');
    }

    :root {
      --pond-bg: #93fff1;
      --black-border: #101010;
      --radius: 22px;
      --half-radius: 11px;
      --border-width: 2px;
      --card-green: #D0F8D2;
      --body-background: #fff8ec;
      --button-radius: 50px;
      --theme-error: #F23D4F;
      --purple: #b29bf4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--pond-bg);
      min-height: 100vh;
      padding: 40px 24px 24px;
    }

    .game-font { font-family: 'LuckiestGuy', sans-serif; }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ── Status ──────────────────────────── */

    .status-bar {
      padding: 8px 16px;
      border-radius: var(--half-radius);
      background: rgba(0,0,0,0.05);
      font-size: 13px;
      color: #555;
      display: none;
    }

    .status-bar.visible { display: block; }

    /* ── White panel ─────────────────────── */

    .rewards-panel {
      background: #ffffff;
      border: var(--border-width) solid var(--black-border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: calc(100vh - 220px);
    }

    /* ── Profile header ────────────────────── */

    .profile-header {
      background: #ffffff;
      border: var(--border-width) solid var(--black-border);
      border-radius: var(--radius);
      padding: 24px 28px;
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .profile-avatar {
      width: 140px;
      height: 140px;
      border-radius: var(--half-radius);
      border: var(--border-width) solid var(--black-border);
      flex-shrink: 0;
      object-fit: cover;
      display: block;
      background: #D0F8D2;
    }
    .profile-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }
    .profile-name-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .profile-username {
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 36px;
      color: var(--black-border);
      line-height: 1;
      letter-spacing: 0.02em;
    }
    .profile-social {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: var(--border-width) solid var(--black-border);
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: var(--black-border);
      flex-shrink: 0;
      margin-top: -14px;
      box-shadow: 3px 2px 0 var(--black-border);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .profile-social:active {
      transform: translate(2px, 1.5px);
      box-shadow: none;
    }
    .profile-social svg { width: 14px; height: 14px; display: block; }
    .profile-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .profile-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #f4f4f4;
      border: var(--border-width) solid #888;
      border-radius: 50px;
      padding: 5px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: var(--black-border);
      white-space: nowrap;
    }
    .profile-badge.badge-streak  { background: #FFE4D6; border-color: #E89060; color: #B5531A; }
    .profile-badge.badge-flies   { background: #D0F8D2; border-color: #5FB564; color: #1E6F22; }
    .profile-badge.badge-tourn   { background: #FFF4CC; border-color: #D9B74A; color: #8A6A12; }
    .profile-badge.badge-battles { background: #E6D9FF; border-color: #9B7ED9; color: #4E2B9E; }
    .profile-badge-icon {
      font-size: 14px;
      line-height: 1;
    }

    @media (max-width: 700px) {
      .profile-header { padding: 0 16px 16px 0; gap: 14px; min-height: 120px; }
      .profile-avatar { width: 120px; height: 120px; }
      .profile-info { padding-top: 16px; }
      .profile-username { font-size: 22px; }
      .profile-social { width: 26px; height: 26px; }
      .profile-social svg { width: 12px; height: 12px; }
      .profile-badge { font-size: 11px; padding: 4px 10px; }
    }

    #battleTab {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* ── Header ───────────────────────────── */

    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px 16px;
    }

    .page-title {
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 28px;
      color: var(--black-border);
      line-height: 1.15;
    }

    /* ── Tabs (GibTabs pattern) ───────────── */

    .tabs {
      display: flex;
      position: relative;
      border: var(--border-width) solid var(--black-border);
      border-radius: 100px;
      background: #fff;
      padding: 4px;
      user-select: none;
      cursor: pointer;
      overflow: hidden;
      flex-shrink: 0;
    }

    .tab {
      flex: 1;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      border: none;
      border-radius: 100px;
      background: transparent;
      color: rgba(0,0,0,0.35);
      transition: background 0.12s, color 0.12s;
      white-space: nowrap;
      position: relative;
      z-index: 1;
    }

    .tab.active {
      background: var(--black-border);
      color: #fff;
    }

    /* ── Totals strip ────────────────────── */

    .totals-strip {
      display: flex;
      gap: 12px;
      padding: 0 24px 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .totals-strip::-webkit-scrollbar { display: none; }

    .total-box {
      flex: 1 0 0;
      min-width: 160px;
      max-width: 240px;
      background: #f4f4f4;
      border-radius: var(--half-radius);
      padding: 12px 16px 12px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .total-box:first-child {
      background: linear-gradient(135deg, #f0e6ff 0%, #e6f0ff 100%);
    }

    .total-coin {
      width: 56px;
      height: 56px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .total-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .total-box .total-value {
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 24px;
      color: var(--black-border);
      line-height: 1.15;
      white-space: nowrap;
    }

    .total-box:first-child .total-value {
      color: #9945FF;
    }

    .total-box .total-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* ── Section headers ──────────────────── */

    .section-title {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 800;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 0 24px 10px;
    }

    /* ── Card grid ────────────────────────── */

    .card-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 0 24px 24px;
    }

    /* ── Reward card — NO border ──────────── */

    .reward-card {
      background: var(--card-green);
      border-radius: var(--half-radius);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }

    .reward-card .stage-icon {
      width: 120px;
      height: 120px;
      background-size: 400% 100%;
      background-repeat: no-repeat;
      flex-shrink: 0;
    }

    .reward-card .tournament-name {
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 16px;
      text-transform: uppercase;
      color: var(--black-border);
      letter-spacing: 0.5px;
      line-height: 1.15;
    }

    .reward-card .rounds-label {
      font-size: 13px;
      color: #555;
      font-weight: 500;
    }


    .reward-card .prizes-list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .prize-line {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 14px;
      color: var(--black-border);
      line-height: 1.15;
    }

    .token-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }

    .flies-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #b0edb4;
      color: #01b22e;
      border-radius: 100px;
      padding: 4px 10px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      margin-top: 6px;
    }

    .flies-pill svg {
      width: 14px;
      height: 14px;
    }

    /* ── Battle log ─────────────────────────── */

    .tourn-selector {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0;
      border-top: 2px solid var(--black-border);
      border-bottom: 2px solid var(--black-border);
      overflow: hidden;
      height: 140.5px;
    }
    .tourn-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      z-index: 0;
    }
    .tourn-asset {
      position: relative;
      z-index: 1;
      height: 140.5px;
      width: auto;
      object-fit: contain;
      flex-shrink: 0;
    }
    .tourn-asset-left { margin-left: 12px; }
    .tourn-asset-right { margin-right: 12px; }
    .tourn-name {
      position: relative;
      z-index: 2;
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 28px;
      color: #fff;
      letter-spacing: 0.05em;
      -webkit-text-stroke: 2px #101010;
      paint-order: stroke fill;
      text-align: center;
      flex: 1;
      white-space: nowrap;
    }
    .tourn-name-plain {
      color: var(--black-border);
      text-shadow: none;
      font-size: 20px;
    }
    .nav-btn {
      position: relative;
      z-index: 3;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--black-border);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      box-shadow: 4.5px 3px 0 var(--black-border);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .nav-btn:active {
      transform: translate(3px, 2px);
      box-shadow: none;
    }
    .nav-btn-left { margin-left: 16px; }
    .nav-btn-right { margin-right: 16px; }
    .nav-arrow { width: 13px; height: 13px; display: block; }
    .nav-arrow-right { transform: scaleX(-1); }

    .table-scroll {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    .battle-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 360px;
    }

    .battle-table thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f5f5f5;
      border-bottom: 1.5px solid #c0c0c0;
      padding: 11px 20px;
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      white-space: nowrap;
    }

    .battle-table tbody tr {
      border-bottom: 1px solid #ebebeb;
      cursor: pointer;
      transition: background 0.1s;
    }
    .battle-table tbody tr:last-child { border-bottom: none; }
    .battle-table tbody tr:hover { background: #fafafa; }

    .battle-table td {
      padding: 14px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--black-border);
      white-space: nowrap;
    }

    .battle-table .round-td { font-size: 15px; font-weight: 700; }
    .battle-table .deck-td { padding-top: 10px; padding-bottom: 10px; }
    .battle-table .date-td { color: #888; font-weight: 600; font-size: 13px; line-height: 1.4; }
    .battle-table .date-time { font-weight: 300; }

    .deck-preview {
      display: flex;
      gap: 6px;
    }

    .deck-mini-card {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      border: 2px solid var(--black-border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .deck-mini-card-img {
      flex: 1;
      min-height: 0;
    }

    .deck-mini-card-name {
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 7px;
      font-weight: 800;
      text-align: center;
      color: var(--black-border);
      padding: 1px 2px;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border-top: 1.5px solid var(--black-border);
    }

    .outcome-pill {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 800;
      border-radius: 50px;
      padding: 4px 12px;
      letter-spacing: 0.04em;
    }
    .outcome-pill.win { background: #D0F8D2; color: #01831c; }
    .outcome-pill.loss { background: #FFD8D8; color: #b91c1c; }

    .prize-flies {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--black-border);
    }
    .prize-fly-icon { width: 16px; height: 16px; flex-shrink: 0; }
    .prize-cash {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--black-border);
    }

    /* ── Carousel popup ─────────────────────── */

    .sheet {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
    }
    .carousel-panel {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 750px;
      border-radius: var(--radius);
      border: var(--border-width) solid var(--black-border);
      padding: 20px;
      gap: 14px;
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .carousel-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .carousel-tname {
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 32px;
      color: var(--black-border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: translateY(2px);
    }
    .carousel-close {
      width: 32px;
      height: 32px;
      border: var(--border-width) solid var(--black-border);
      background: #fff;
      border-radius: 50%;
      font-size: 18px;
      color: var(--black-border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-family: 'Inter', sans-serif;
      line-height: 1;
      box-shadow: 3px 2px 0 var(--black-border);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .carousel-close:active {
      transform: translate(2px, 1.5px);
      box-shadow: none;
    }

    /* ── Cards / Charts toggle ────────────── */

    .carousel-toggle {
      display: flex;
      border: 2px solid var(--black-border);
      border-radius: 50px;
      overflow: hidden;
      background: #fff;
      flex-shrink: 0;
    }
    .toggle-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 16px;
      border: none;
      cursor: pointer;
      background: #fff;
      color: #999;
      border-radius: 50px;
      transition: background 0.15s, color 0.15s;
    }
    .toggle-btn.toggle-active {
      background: var(--black-border);
      color: #fff;
    }
    .toggle-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

    /* ── GibBattle inside carousel ─────────── */

    .battle-frame {
      display: flex;
      flex-direction: column;
      border: var(--border-width) solid var(--black-border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }
    .battle-status-row {
      display: flex;
      border-bottom: var(--border-width) solid var(--black-border);
    }
    .battle-status-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 42px;
      padding: 0 16px;
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 16px;
    }
    .battle-status-bar img { width: 20px; height: 20px; }
    .battle-status-result {
      flex: 1.1;
    }
    .battle-status-round {
      flex: 1;
      gap: 10px;
    }
    .battle-status-bar.status-win { background: #D0F8D2; color: #01b22e; }
    .battle-status-bar.status-loss { background: #FFD8D8; color: #b91c1c; }
    .battle-status-round { background: #D0F8D2; color: #01b22e; }
    .battle-status-bar .fontoffset { transform: translateY(2px); }
    .status-flies {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(1, 178, 46, 0.15);
      color: #01b22e;
      font-size: 12px;
      border-radius: 50px;
      padding: 3px 10px 1px;
      font-family: 'LuckiestGuy', sans-serif;
    }
    .status-flies img { width: 14px; height: 14px; }

    .battle-arena {
      display: flex;
      align-items: stretch;
      gap: 0;
      padding: 16px;
      background: #fff;
    }
    .arena-side {
      flex: 1;
      min-width: 0;
      border-radius: var(--radius);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .arena-winner { background: #D0F8D2; }
    .arena-loser { background: #FFD8D8; }
    .arena-cards {
      display: flex;
      gap: 0;
      justify-content: center;
    }
    .arena-stats {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .arena-user {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      color: var(--black-border);
      background: #fff;
      border: var(--border-width) solid var(--black-border);
      border-radius: 50px;
      padding: 4px 10px 4px 4px;
      box-shadow: 2px 1.5px 0 var(--black-border);
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
    }
    .arena-user-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .arena-power {
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 16px;
      white-space: nowrap;
      transform: translateY(2px);
    }
    .arena-winner .arena-power { color: #01b22e; }
    .arena-loser .arena-power { color: var(--theme-error); }

    .arena-vs {
      flex-shrink: 0;
      width: 45px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 16px;
      color: var(--black-border);
      background: #fff;
      border: var(--border-width) solid var(--black-border);
      border-radius: 50%;
      padding-top: 6px;
    }

    /* ── Carousel nav ──────────────────────── */

    .carousel-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .carousel-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid var(--black-border);
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      padding: 0;
      box-shadow: 3px 2px 0 var(--black-border);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .carousel-btn:active {
      transform: translate(2px, 1.5px);
      box-shadow: none;
    }
    .carousel-btn img { width: 13px; height: 13px; display: block; }
    .carousel-btn-right img { transform: scaleX(-1); }
    .carousel-counter {
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 14px;
      color: var(--black-border);
      background: #fff;
      border: var(--border-width) solid var(--black-border);
      border-radius: 50px;
      padding: 8px 16px;
      transform: translateY(2px);
      white-space: nowrap;
    }

    /* ── Mini cards (used in carousel) ─────── */

    .mini-card {
      width: 100px;
      flex-shrink: 0;
      border-radius: calc(var(--radius) * 0.7);
      overflow: hidden;
      border: var(--border-width) solid var(--black-border);
      display: flex;
      flex-direction: column;
    }
    .mini-card-media {
      position: relative;
      width: 100%;
      padding-top: 100%;
      overflow: hidden;
    }
    .mini-card-label {
      position: absolute;
      top: 2px;
      left: 0;
      right: 0;
      margin: auto;
      z-index: 3;
      font-family: 'Inter', sans-serif;
      font-size: 8px;
      font-weight: 800;
      color: #000;
      background: #fff;
      border-radius: 50px;
      border: var(--border-width) solid var(--black-border);
      padding: 1px 5px;
      width: fit-content;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .mini-card-img {
      position: absolute;
      top: -4px;
      left: 0;
      right: 0;
      bottom: 0;
      margin: auto;
      width: calc(100% - 16px);
      height: calc(100% - 16px);
      object-fit: cover;
      border-radius: 50%;
      z-index: 2;
    }
    .mini-card-decoration {
      position: absolute;
      top: -4px;
      left: -100%;
      right: 0;
      bottom: 0;
      margin: auto;
      width: 300%;
      height: 200%;
      z-index: 1;
      opacity: 0.15;
    }
    .mini-card-stats {
      background: #fff;
      padding: 5px 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 12px;
      color: #01b22e;
      border-top: var(--border-width) solid var(--black-border);
      margin-top: -14px;
      z-index: 2;
      position: relative;
    }
    .mini-card-stats svg { width: 12px; height: 12px; flex-shrink: 0; }

    /* ── Chart view ─────────────────────────── */

    .chart-view {
      border: var(--border-width) solid var(--black-border);
      border-radius: var(--radius);
      overflow: hidden;
      background: #fff;
    }
    .chart-period-toggle {
      display: flex;
      gap: 0;
      padding: 12px 16px 0;
    }
    .period-btn {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border: none;
      cursor: pointer;
      background: #e0e0e0;
      color: #666;
      border-radius: 50px;
      transition: background 0.15s, color 0.15s;
    }
    .period-btn.period-active {
      background: var(--black-border);
      color: #fff;
    }
    .chart-area {
      position: relative;
      padding: 16px;
      min-height: 220px;
    }
    .chart-canvas-wrap {
      width: 100%;
      height: 200px;
      position: relative;
    }
    .chart-canvas-wrap canvas {
      width: 100%;
      height: 100%;
    }
    .chart-divider {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 8px;
      transform: translateX(-50%);
      background: repeating-linear-gradient(
        to bottom,
        var(--black-border) 0px,
        var(--black-border) 6px,
        #fff 6px,
        #fff 12px
      );
    }
    .chart-legend {
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: absolute;
      bottom: 24px;
      right: 24px;
      background: rgba(0,0,0,0.75);
      border-radius: 12px;
      padding: 8px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      color: #fff;
    }
    .chart-legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .chart-legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .chart-legend-name {
      flex: 1;
    }
    .chart-legend-val {
      font-family: 'LuckiestGuy', sans-serif;
      font-size: 14px;
      transform: translateY(1px);
    }

    .battle-empty {
      text-align: center;
      padding: 60px 20px;
      color: #999;
      font-size: 15px;
    }

    @media (max-width: 768px) {
      .tourn-selector { height: 120px; }
      .tourn-name { font-size: 18px; }
      .tourn-asset { height: 120px; }
      .tourn-asset-left { margin-left: 4px; }
      .tourn-asset-right { margin-right: 4px; }
      .nav-btn { width: 30px; height: 30px; }
      .nav-btn-left { margin-left: 8px; }
      .nav-btn-right { margin-right: 8px; }
      .nav-arrow { width: 11px; height: 11px; }
      .battle-table thead th { padding: 10px 10px; }
      .battle-table td { padding: 10px 10px; font-size: 13px; }
      .battle-table .round-td { font-size: 14px; }
      .deck-mini-card { width: 36px; height: 36px; border-radius: 6px; }
      .deck-mini-card-name { font-size: 6px; }
      .deck-preview { gap: 4px; }
      .battle-table .date-td { font-size: 11px; }

      .sheet { padding: 12px; }
      .carousel-panel { padding: 14px; gap: 10px; }
      .carousel-top { flex-wrap: wrap; }
      .carousel-tname { font-size: 22px; }
      .toggle-btn { font-size: 11px; padding: 5px 12px; }
      .toggle-btn svg { width: 14px; height: 14px; }

      .battle-arena {
        flex-direction: column;
        gap: 0;
        padding: 10px;
      }
      .arena-side {
        width: 100%;
        border-radius: 16px;
        padding: 10px;
      }
      .arena-side:first-child {
        border-bottom-left-radius: 0;
        border-bottom-right-radius: 0;
      }
      .arena-side:last-child {
        border-top-left-radius: 0;
        border-top-right-radius: 0;
      }
      .arena-vs {
        margin: -22px auto;
        z-index: 1;
      }
      .arena-cards { width: 100%; }
      .mini-card { flex: 1; width: auto; min-width: 0; }
      .battle-status-bar { font-size: 13px; height: 36px; }
      .chart-canvas-wrap { height: 160px; }
      .chart-legend { font-size: 11px; padding: 6px 10px; bottom: 16px; right: 16px; }
    }

    /* ── Empty / error / loading ───────────── */

    .loading { text-align: center; padding: 40px; font-size: 16px; color: #666; }
    .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 15px; }
    .error-msg { text-align: center; padding: 20px; color: var(--theme-error); font-weight: 600; }

    /* ── Skeleton loading ─────────────────── */

    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }

    .skeleton {
      background: linear-gradient(90deg, #e0e0e0 25%, #f0f0f0 50%, #e0e0e0 75%);
      background-size: 800px 100%;
      animation: shimmer 1.5s infinite linear;
      border-radius: 6px;
    }

    .skeleton-card {
      background: var(--card-green);
      border-radius: var(--half-radius);
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .skeleton-card .skeleton-img {
      width: 120px;
      height: 120px;
      border-radius: 8px;
    }

    .skeleton-card .skeleton-title {
      width: 80%;
      height: 18px;
    }

    .skeleton-card .skeleton-rounds {
      width: 60%;
      height: 14px;
    }

    .skeleton-card .skeleton-prize {
      width: 70%;
      height: 14px;
    }

    .skeleton-total-box {
      flex: 1 0 0;
      min-width: 160px;
      max-width: 240px;
      background: #f4f4f4;
      border-radius: var(--half-radius);
      padding: 12px 16px 12px 12px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .skeleton-total-box .skeleton-coin {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .skeleton-total-box .skeleton-total-text {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .skeleton-total-box .skeleton-total-value {
      width: 70%;
      height: 22px;
    }

    .skeleton-total-box .skeleton-total-label {
      width: 50%;
      height: 12px;
    }

    @media (max-width: 700px) {
      .skeleton-card .skeleton-img { width: 90px; height: 90px; }
      .skeleton-total-box { min-width: 150px; padding: 10px 12px 10px 10px; }
      .skeleton-total-box .skeleton-coin { width: 44px; height: 44px; }
    }

    /* ── Responsive ────────────────────────── */

    @media (max-width: 900px) {
      .card-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 700px) {
      .section-title { padding: 0 16px 8px; }
      .totals-strip { padding: 0 16px 16px; gap: 10px; }
      .total-box { min-width: 150px; padding: 10px 12px 10px 10px; }
      .total-coin { width: 44px; height: 44px; }
      .total-box .total-value { font-size: 20px; }
      .card-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0 16px 20px; }
      .reward-card .stage-icon { width: 90px; height: 90px; }
      .reward-card .tournament-name { font-size: 14px; }
      body { padding: 24px 12px 16px; }
      .rewards-panel { min-height: calc(100vh - 180px); }
      .page-header { padding: 16px 16px 12px; }
      .page-title { font-size: 22px; }
      .tab { font-size: 13px; padding: 7px 16px; }
    }

    @media (max-width: 480px) {
      .card-grid { grid-template-columns: 1fr 1fr; }
      .page-title { font-size: 18px; }
      .tab { font-size: 12px; padding: 6px 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status-bar" id="statusBar"></div>

    <div class="profile-header">
      <img class="profile-avatar" src="/assets/profile/frog.png" alt="WiderBlusters" />
      <div class="profile-info">
        <div class="profile-name-row">
          <div class="profile-username">@WiderBlusters</div>
          <a class="profile-social" href="https://x.com/WiderBlusters" target="_blank" rel="noopener" aria-label="X profile">
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          </a>
        </div>
        <div class="profile-badges">
          <div class="profile-badge badge-streak"><span class="profile-badge-icon">🔥</span><span>10 Streak</span></div>
          <div class="profile-badge badge-flies"><span class="profile-badge-icon">🪰</span><span>2,110 Flies</span></div>
          <div class="profile-badge badge-tourn"><span class="profile-badge-icon">🏆</span><span>1x Champion</span></div>
          <div class="profile-badge badge-battles"><span class="profile-badge-icon">⚔️</span><span>47 Battles Won</span></div>
        </div>
      </div>
    </div>

    <div class="rewards-panel">
      <div class="page-header">
        <span class="page-title" id="pageTitle">REWARDS LOG</span>
        <div class="tabs">
          <button class="tab active" id="tabRewards" onclick="switchTab('rewards')">Rewards</button>
          <button class="tab" id="tabBattle" onclick="switchTab('battle')">Battles</button>
        </div>
      </div>

      <div id="rewardsTab">
        <div id="totalRewardsSection">
          <div class="section-title">Total Rewards</div>
          <div id="totalsStrip" class="totals-strip"></div>
        </div>
        <div id="tournamentRewardsSection" style="display:none">
          <div class="section-title">Tournament Rewards</div>
        </div>
        <div id="cardGrid"></div>
      </div>

      <div id="battleTab" style="display:none">
        <div class="tourn-selector" id="tournSelector">
          <div class="tourn-bg" id="tournBg"></div>
          <button class="nav-btn nav-btn-left" onclick="prevTournament()">
            <img src="/gib-assets/carousel_arrow_left.svg" class="nav-arrow" alt="Previous" />
          </button>
          <img class="tourn-asset tourn-asset-left" id="tournAssetLeft" alt="" />
          <span class="tourn-name" id="tournName"></span>
          <img class="tourn-asset tourn-asset-right" id="tournAssetRight" alt="" />
          <button class="nav-btn nav-btn-right" onclick="nextTournament()">
            <img src="/gib-assets/carousel_arrow_left.svg" class="nav-arrow nav-arrow-right" alt="Next" />
          </button>
        </div>
        <div class="table-scroll">
          <table class="battle-table">
            <thead>
              <tr>
                <th>Round</th>
                <th>Deck</th>
                <th>Outcome</th>
                <th>Date</th>
              </tr>
            </thead>
            <tbody id="battleTableBody"></tbody>
          </table>
        </div>
      </div>

      <div id="battleSheet" class="sheet" style="display:none">
        <div class="sheet-backdrop" onclick="closeBattleSheet()"></div>
        <div class="carousel-panel" id="carouselPanel">
          <div class="carousel-top">
            <div class="carousel-tname" id="carouselTname"></div>
            <div class="carousel-toggle">
              <button class="toggle-btn toggle-active" id="toggleCards" onclick="setCarouselView('cards')">
                <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="18" rx="2"/><rect x="13" y="3" width="8" height="18" rx="2"/></svg>
                Cards
              </button>
              <button class="toggle-btn" id="toggleCharts" onclick="setCarouselView('charts')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/></svg>
                Charts
              </button>
            </div>
          </div>
          <div id="carouselBattle"></div>
          <div id="carouselCharts" style="display:none"></div>
          <div class="carousel-nav">
            <button class="carousel-btn" onclick="prevCarousel()">
              <img src="/gib-assets/carousel_arrow_left.svg" alt="Previous" />
            </button>
            <div class="carousel-counter" id="carouselCounter"></div>
            <button class="carousel-btn carousel-btn-right" onclick="nextCarousel()">
              <img src="/gib-assets/carousel_arrow_left.svg" alt="Next" />
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const API = window.location.origin;

    const WALLETS = [
      '4trzTcK6W3qCzHs5JkjMZC7Jq14pVSLxRTwkzRzM1HsA',
    ];
    let currentWalletIndex = Math.floor(Math.random() * WALLETS.length);
    let retryTimer = null;

    function getCurrentWallet() {
      return WALLETS[currentWalletIndex];
    }

    function cycleWallet() {
      if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
      if (totalsRetryTimer) { clearTimeout(totalsRetryTimer); totalsRetryTimer = null; }
      currentWalletIndex = (currentWalletIndex + 1) % WALLETS.length;
      loadWallet();
    }

    // ── Tab switching ──────────────────────────
    let battleInitialized = false;
    function switchTab(tab) {
      document.getElementById('tabRewards').className = tab === 'rewards' ? 'tab active' : 'tab';
      document.getElementById('tabBattle').className = tab === 'battle' ? 'tab active' : 'tab';
      document.getElementById('rewardsTab').style.display = tab === 'rewards' ? '' : 'none';
      document.getElementById('battleTab').style.display = tab === 'battle' ? 'flex' : 'none';
      document.getElementById('pageTitle').textContent = tab === 'rewards' ? 'REWARDS LOG' : 'BATTLE LOG';
      if (tab === 'battle' && !battleInitialized) {
        battleInitialized = true;
        renderBattleTable();
      }
    }

    // ── Sprite sheet assignment ─────────────────
    const SPRITE_SHEETS = [
      '/assets/assets_01.png', '/assets/assets_02.png', '/assets/assets_03.png',
      '/assets/assets_04.png', '/assets/assets_05.png', '/assets/assets_06.png',
      '/assets/assets_07.png', '/assets/assets_08.png', '/assets/assets_09.png',
      '/assets/assets_10.png', '/assets/assets_11.png', '/assets/assets_12.png',
      '/assets/assets_13.png', '/assets/assets_14.png', '/assets/assets_15.png',
      '/assets/assets_16.png', '/assets/assets_17.png',
    ];

    function getSpriteSheet(tournamentIndex) {
      // Shuffle sprite sheets with a fixed seed so the order is random
      // but consistent across page loads, and adjacent tournaments never share colors
      const shuffled = [...SPRITE_SHEETS];
      let seed = 48271;
      for (let i = shuffled.length - 1; i > 0; i--) {
        seed = (seed * 16807) % 2147483647;
        const j = seed % (i + 1);
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled[tournamentIndex % shuffled.length];
    }

    // ── Stage logic ────────────────────────────
    function getStage(lastRound, totalRounds) {
      if (lastRound <= 1) return 0;
      const remaining = totalRounds - 1;
      const lower = 1 + Math.floor(remaining * 0.4);
      const upper = 1 + Math.floor(remaining * 0.8);
      if (lastRound <= lower) return 1;
      if (lastRound <= upper) return 2;
      return 3;
    }

    function stagePosition(stage) {
      // Sprite sheet: 4 assets, each 500px wide in a 2000px image
      // background-position percentages: 0%, 33.333%, 66.666%, 100%
      const positions = ['0%', '33.333%', '66.666%', '100%'];
      return positions[stage] || '0%';
    }

    // ── Skeleton loaders ───────────────────────
    function showSkeletons() {
      // Totals skeleton
      const section = document.getElementById('totalRewardsSection');
      const strip = document.getElementById('totalsStrip');
      section.style.display = '';
      strip.innerHTML = Array(3).fill(`
        <div class="skeleton-total-box">
          <div class="skeleton skeleton-coin"></div>
          <div class="skeleton-total-text">
            <div class="skeleton skeleton-total-value"></div>
            <div class="skeleton skeleton-total-label"></div>
          </div>
        </div>
      `).join('');

      // Cards skeleton
      const tournSection = document.getElementById('tournamentRewardsSection');
      tournSection.style.display = '';
      document.getElementById('cardGrid').innerHTML = `<div class="card-grid">
        ${Array(8).fill(`
          <div class="skeleton-card">
            <div class="skeleton skeleton-img"></div>
            <div class="skeleton skeleton-title"></div>
            <div class="skeleton skeleton-rounds"></div>
            <div class="skeleton skeleton-prize"></div>
            <div class="skeleton skeleton-prize"></div>
          </div>
        `).join('')}
      </div>`;
    }

    // ── Load wallet ────────────────────────────
    let totalsRetryTimer = null;
    let totalsLoaded = false;

    async function loadWallet() {
      const wallet = getCurrentWallet();
      totalsLoaded = false;
      if (totalsRetryTimer) { clearTimeout(totalsRetryTimer); totalsRetryTimer = null; }

      const status = document.getElementById('statusBar');
      status.className = 'status-bar visible';
      status.textContent = 'Loading rewards from Solana...';

      showSkeletons();

      // Load tournaments and totals independently so one doesn't block the other
      loadTournaments(wallet, status);
      loadTotals(wallet);
    }

    async function loadTournaments(wallet, status) {
      try {
        const res = await fetch(`${API}/api/rewards/tournaments/${wallet}?limit=100`);
        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.error || `Server error (${res.status})`);
        }

        const data = await res.json();

        if (data.error) {
          document.getElementById('cardGrid').innerHTML = `<div class="error-msg">${data.error}</div>`;
          status.className = 'status-bar';
          return;
        }

        renderCards(data.tournaments);

        // If no data yet (first sync in progress), retry in 5s
        if (data.total === 0 && !retryTimer) {
          status.textContent = 'Syncing wallet data from Solana... reloading shortly.';
          retryTimer = setTimeout(() => { retryTimer = null; loadWallet(); }, 5000);
          return;
        }

        status.textContent = `${data.total} tournaments loaded.`;
        setTimeout(() => { status.className = 'status-bar'; }, 3000);

      } catch (err) {
        document.getElementById('cardGrid').innerHTML = `<div class="error-msg">${err.message}</div>`;
        status.className = 'status-bar';
      }
    }

    async function loadTotals(wallet, attempt) {
      attempt = attempt || 1;
      try {
        const res = await fetch(`${API}/api/rewards/totals/${wallet}`);
        if (!res.ok) return; // silent fail — skeleton stays visible

        const data = await res.json();
        const totals = data.totals || [];
        const nonZero = totals.filter(t => Number(t.amount_parsed) > 0);

        if (nonZero.length) {
          totalsLoaded = true;
          renderTotals(totals);
        } else if (attempt < 12) {
          // Totals might be empty during sync (can take up to 30s) — retry up to 11 times
          totalsRetryTimer = setTimeout(() => loadTotals(wallet, attempt + 1), 3000);
        }
        // If all retries exhausted with no data, skeleton just stays — better than hiding
      } catch (err) {
        // Silent fail — skeleton stays visible rather than hiding
        if (attempt < 12) {
          totalsRetryTimer = setTimeout(() => loadTotals(wallet, attempt + 1), 3000);
        }
      }
    }

    // ── Render totals strip ─────────────────────
    const COIN_IMAGES = {
      SOL: '/assets/3D coins/3DCoins_500px__0022_SOL.png.png',
      BONK: '/assets/3D coins/3DCoins_500px__0002_BONK.png',
      WIF: '/assets/3D coins/3DCoins_500px__0003_WIF.png',
      WEN: '/assets/3D coins/3DCoins_500px__0004_WEN.png',
      POPCAT: '/assets/3D coins/3DCoins_500px__0007_POPCAT.png',
      ENTROPY: '/assets/3D coins/3DCoins_500px__0016_ENTROPY.png',
      CHONKY: '/assets/3D coins/3DCoins_500px__0017_CHONKY.png',
      TROLL: '/assets/3D coins/3DCoins_500px__0019_TROLL.png',
      MPLX: '/assets/3D coins/3DCoins_500px__0020_MPLX.png',
      USDC: '/assets/3D coins/3DCoins_500px__0001_USDC.png',
      SKR: '/assets/3D coins/SKR COIN.png',
    };

    function getCoinImage(symbol) {
      return COIN_IMAGES[symbol] || COIN_IMAGES['SOL'];
    }

    function renderTotals(totals) {
      const strip = document.getElementById('totalsStrip');
      const section = document.getElementById('totalRewardsSection');

      // Filter out zero values
      const nonZero = totals.filter(t => Number(t.amount_parsed) > 0);

      // Always keep section visible — skeleton stays if no data yet
      section.style.display = '';

      if (!nonZero.length) return;

      // Sort: SOL first, then alphabetically by symbol
      nonZero.sort((a, b) => {

    // ── Helpers ─────────────────────────────────
    function formatTotal(n) {
      n = Number(n);
      if (isNaN(n) || n === 0) return '0';
      if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
      if (n >= 10000) return (n / 1000).toFixed(2) + 'K';
      if (n >= 1000) return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (n < 1) return n.toFixed(4);
      return n.toFixed(2);
    }

    function formatNumber(n) {
      n = Number(n);
      if (isNaN(n)) return '0';
      if (n >= 1000) return n.toLocaleString('en-US', { maximumFractionDigits: 2 });
      if (n < 0.001 && n > 0) return n.toFixed(4);
      return n.toLocaleString('en-US', { maximumFractionDigits: 4 });
    }

            mkBattle('Maritest',['AIXBT','PUPS','MON'],344,'Neonbull',['GRIFFAIN','DOG','PEPX'],358,false),
          ]},
          { roundNumber:5, date:'June 5, 2025 10:00 AM', prize:'$80 USD', battles:[
            mkBattle('Maritest',['RENDER','VIRTUAL','LABUBU'],425,'Zoltrix',['MELANIA','CWIF','PUMP'],398,true),
            mkBattle('Maritest',['ELIZA','SIGMA','HONEY'],261,'Cluckz',['SILLY','VINE','ROCKY'],248,true),
          ]},
          { roundNumber:6, date:'June 6, 2025 8:30 PM', prize:'$100 USD', battles:[
            mkBattle('Maritest',['RENDER','VIRTUAL','LABUBU'],425,'Biccs',['ZEREBRO','BABYDOGE','NPC'],310,true),
            mkBattle('Maritest',['AIXBT','PUPS','MON'],344,'Hyuts',['GRIFFAIN','PEPX','CWIF'],329,true),
          ]},
        ],
      },
      {
        id:'sol-incinerator', name:'SOL-INCINERATOR', color:'#F2877A',
        banner: {
          desktopBg: '/assets/tournament-banners/sol-incinerator/desktop-bg.png',
          mobileBg: '/assets/tournament-banners/sol-incinerator/mobile-bg.png',
          left: '/assets/tournament-banners/sol-incinerator/left.png',
          right: '/assets/tournament-banners/sol-incinerator/right.png',
        },
        rounds:[
          { roundNumber:1, date:'June 6, 2025 11:45 AM', prize:'10 Flies', battles:[
            mkBattle('Maritest',['CWIF','HONEY','ROCKY'],257,'Warpzone',['MON','PUMP','ZEREBRO'],271,false),
          ]},
        ],
      },
    ];

    let activeTournIdx = 0;

    function prevTournament() {
      activeTournIdx = (activeTournIdx - 1 + BATTLE_TOURNAMENTS.length) % BATTLE_TOURNAMENTS.length;
      renderBattleTable();
    }

    function nextTournament() {
      activeTournIdx = (activeTournIdx + 1) % BATTLE_TOURNAMENTS.length;
      renderBattleTable();
    }

    function getActiveBattles() {
      const t = BATTLE_TOURNAMENTS[activeTournIdx];
      const deckMap = new Map();
      let deckCounter = 0;
      const sortedRounds = [...t.rounds].sort((a, b) => a.roundNumber - b.roundNumber);
      for (const r of sortedRounds) {
        for (const b of r.battles) {
          const fp = deckFp(b);
          if (!deckMap.has(fp)) deckMap.set(fp, ++deckCounter);
        }
      }

      const rows = [];
      for (const r of t.rounds) {
        for (const b of r.battles) {
          rows.push({
            id: b.id,
            roundNumber: r.roundNumber,
            deckNumber: deckMap.get(deckFp(b)),
            date: r.date,
            prize: r.prize,
            won: b.my.won,
            battle: b,
          });
        }
      }

      return rows.sort((a, b) => {
        if (b.roundNumber !== a.roundNumber) return b.roundNumber - a.roundNumber;
        return a.deckNumber - b.deckNumber;
      });
    }

    function renderBattleTable() {
      const t = BATTLE_TOURNAMENTS[activeTournIdx];
      const nameEl = document.getElementById('tournName');
      const selectorEl = document.getElementById('tournSelector');
      const bgEl = document.getElementById('tournBg');
      const leftAsset = document.getElementById('tournAssetLeft');
      const rightAsset = document.getElementById('tournAssetRight');

      nameEl.textContent = t.name + ' TOURNAMENT';

      if (t.banner) {
        const isMobile = window.innerWidth <= 768;
        bgEl.style.backgroundImage = `url('${isMobile ? t.banner.mobileBg : t.banner.desktopBg}')`;
        bgEl.style.display = '';
        selectorEl.style.background = 'none';
        leftAsset.src = t.banner.left;
        leftAsset.style.display = '';
        rightAsset.src = t.banner.right;
        rightAsset.style.display = '';
        nameEl.classList.remove('tourn-name-plain');
      } else {
        bgEl.style.display = 'none';
        bgEl.style.backgroundImage = '';
        selectorEl.style.background = t.color;
        leftAsset.style.display = 'none';
        rightAsset.style.display = 'none';
        nameEl.classList.add('tourn-name-plain');
      }

      const rows = getActiveBattles();
      const tbody = document.getElementById('battleTableBody');

      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="4" class="battle-empty">No battles found.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map((row, i) => {
        const outcomeClass = row.won ? 'win' : 'loss';
        const outcomeText = row.won ? 'WIN' : 'LOSS';

        const deckHtml = row.battle.my.cards.map(c => {
          const color = CARD_COLORS[c.meme] || '#888';
          return `<div class="deck-mini-card">
            <div class="deck-mini-card-img" style="background:${color}"></div>
            <div class="deck-mini-card-name">${escHtml(c.meme)}</div>
          </div>`;
        }).join('');

        return `<tr onclick="openBattleSheet(${i})">
          <td class="round-td">${row.roundNumber}</td>
          <td class="deck-td"><div class="deck-preview">${deckHtml}</div></td>
          <td><span class="outcome-pill ${outcomeClass}">${outcomeText}</span></td>
          <td class="date-td">${(() => {
            const d = row.date || '';
            const m = d.match(/^(.+\d{4})\s+(.+)$/);
            return m ? escHtml(m[1]) + ' <span class="date-time">' + escHtml(m[2]) + '</span>' : escHtml(d);
          })()}</td>
        </tr>`;
      }).join('');
    }

    function renderMiniCard(card) {
      const color = CARD_COLORS[card.meme] || '#888';
      const powerVal = typeof card.power === 'number' ? '+' + (Math.round(card.power * 1000) / 1000) : '';
      const imgSrc = `/assets/card-images/${card.meme}.png`;
      const chartIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="#01b22e" stroke-width="2.5" stroke-linecap="round"><polyline points="3 17 9 11 13 15 21 7"/></svg>`;
      return `<div class="mini-card" style="background-color:${color}">
        <div class="mini-card-media">
          <div class="mini-card-label">${escHtml(card.meme)}</div>
          <img class="mini-card-img" src="${imgSrc}" alt="${escHtml(card.meme)}" onerror="this.style.display='none'" />
        </div>
        <div class="mini-card-stats">${powerVal} ${chartIcon}</div>
      </div>`;
    }

    function renderBattleCarousel(row) {
      const battle = row.battle;
      const my = battle.my;
      const opp = battle.opponent;
      const myColor = userColor(my.username);
      const oppColor = userColor(opp.username);

      const isFlies = row.roundNumber === 1;
      const fliesPill = isFlies
        ? `<span class="status-flies"><img src="/gib-assets/fly.svg" alt="" /> <span class="fontoffset">10 FLIES</span></span>`
        : '';

      const resultClass = my.won ? 'status-win' : 'status-loss';
      const resultText = my.won ? 'WON' : 'LOST';
      const prizeNote = my.won ? ` — ${escHtml(row.prize)}` : '';

      const statusBar = `<div class="battle-status-row">
        <div class="battle-status-bar battle-status-result ${resultClass}">
          <span class="fontoffset">${resultText}${prizeNote}</span>
        </div>
        <div class="battle-status-bar battle-status-round">
          <span class="fontoffset">⚔ ROUND ${row.roundNumber}</span>
          ${fliesPill}
        </div>
      </div>`;

      return `<div class="battle-frame">
        ${statusBar}
        <div class="battle-arena">
          <div class="arena-side ${my.won ? 'arena-winner' : 'arena-loser'}">
            <div class="arena-cards">${my.cards.map(renderMiniCard).join('')}</div>
            <div class="arena-stats">
              <div class="arena-user">
                <div class="arena-user-avatar" style="background:${myColor}"></div>
                ${escHtml(my.username)}
              </div>
              <span class="arena-power">POWER ${my.deckPower}</span>
            </div>
          </div>
          <div class="arena-vs">VS.</div>
          <div class="arena-side ${opp.won ? 'arena-winner' : 'arena-loser'}">
            <div class="arena-cards">${opp.cards.map(renderMiniCard).join('')}</div>
            <div class="arena-stats">
              <div class="arena-user">
                <div class="arena-user-avatar" style="background:${oppColor}"></div>
                ${escHtml(opp.username)}
              </div>
              <span class="arena-power">POWER ${opp.deckPower}</span>
            </div>
          </div>
        </div>
      </div>`;
    }

    let currentBattleRows = [];
    let carouselPosition = 0;
    let carouselView = 'cards';

    function setCarouselView(view) {
      carouselView = view;
      document.getElementById('toggleCards').classList.toggle('toggle-active', view === 'cards');
      document.getElementById('toggleCharts').classList.toggle('toggle-active', view === 'charts');
      document.getElementById('carouselBattle').style.display = view === 'cards' ? '' : 'none';
      document.getElementById('carouselCharts').style.display = view === 'charts' ? '' : 'none';
      if (view === 'charts') renderChartView();
    }

    function renderChartView() {
      const row = currentBattleRows[carouselPosition];
      if (!row) return;
      const battle = row.battle;
      const my = battle.my;
      const opp = battle.opponent;
      const myColor = userColor(my.username);
      const oppColor = userColor(opp.username);

      const isFlies = row.roundNumber === 1;
      const fliesPill = isFlies
        ? `<span class="status-flies"><img src="/gib-assets/fly.svg" alt="" /> <span class="fontoffset">10 FLIES</span></span>`
        : '';
      const resultClass = my.won ? 'status-win' : 'status-loss';
      const resultText = my.won ? 'WON' : 'LOST';

      const statusBar = `<div class="battle-status-row">
        <div class="battle-status-bar battle-status-result ${resultClass}">
          <span class="fontoffset">${resultText}</span>
        </div>
        <div class="battle-status-bar battle-status-round">
          <span class="fontoffset">⚔ ROUND ${row.roundNumber}</span>
          ${fliesPill}
        </div>
      </div>`;

      document.getElementById('carouselCharts').innerHTML = `<div class="chart-view">
        ${statusBar}
        <div class="chart-period-toggle">
          <button class="period-btn" onclick="this.parentElement.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('period-active'));this.classList.add('period-active')">1D</button>
          <button class="period-btn" onclick="this.parentElement.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('period-active'));this.classList.add('period-active')">3D</button>
          <button class="period-btn period-active" onclick="this.parentElement.querySelectorAll('.period-btn').forEach(b=>b.classList.remove('period-active'));this.classList.add('period-active')">7D</button>
        </div>
        <div class="chart-area">
          <div class="chart-canvas-wrap">
            <canvas id="chartCanvas"></canvas>
            <div class="chart-divider"></div>
          </div>
          <div class="chart-legend">
            <div class="chart-legend-row">
              <div class="chart-legend-dot" style="background:#ff47a3"></div>
              <span class="chart-legend-name">${escHtml(opp.username)}</span>
              <span class="chart-legend-val">${opp.deckPower}</span>
            </div>
            <div class="chart-legend-row">
              <div class="chart-legend-dot" style="background:#a78bfa"></div>
              <span class="chart-legend-name">${escHtml(my.username)}</span>
              <span class="chart-legend-val">${my.deckPower}</span>
            </div>
          </div>
        </div>
      </div>`;

      drawPowerChart(my, opp);
    }

    function drawPowerChart(my, opp) {
      const canvas = document.getElementById('chartCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      const w = rect.width;
      const h = rect.height;

      const myPow = parseFloat(my.deckPower) || 1;
      const oppPow = parseFloat(opp.deckPower) || 1;
      const maxPow = Math.max(myPow, oppPow) * 1.3;
      const pts = 40;

      function genLine(basePow) {
        const line = [];
        let val = basePow;
        for (let i = 0; i <= pts; i++) {
          val += (Math.random() - 0.48) * basePow * 0.12;
          val = Math.max(basePow * 0.4, Math.min(maxPow, val));
          if (i === pts) val = basePow;
          line.push(val);
        }
        return line;
      }

      const myLine = genLine(myPow);
      const oppLine = genLine(oppPow);

      function drawLine(line, color) {
        ctx.beginPath();
        ctx.strokeStyle = color;
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        for (let i = 0; i <= pts; i++) {
          const x = (i / pts) * w;
          const y = h - (line[i] / maxPow) * (h - 20) - 10;
          if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      ctx.clearRect(0, 0, w, h);
      drawLine(myLine, '#a78bfa');
      drawLine(oppLine, '#ff47a3');
    }

    function renderCarouselAt() {
      const row = currentBattleRows[carouselPosition];
      if (!row) return;
      document.getElementById('carouselBattle').innerHTML = renderBattleCarousel(row);
      if (carouselView === 'charts') renderChartView();
      const nav = document.querySelector('.carousel-nav');
      if (currentBattleRows.length <= 1) {
        nav.style.display = 'none';
      } else {
        nav.style.display = '';
        document.getElementById('carouselCounter').textContent =
          (carouselPosition + 1) + ' OF ' + currentBattleRows.length;
      }
    }

    function openBattleSheet(idx) {
      currentBattleRows = getActiveBattles();
      if (!currentBattleRows.length) return;
      carouselPosition = Math.min(idx, currentBattleRows.length - 1);
      carouselView = 'cards';

      const t = BATTLE_TOURNAMENTS[activeTournIdx];
      document.getElementById('carouselTname').textContent = t.name + ' TOURNAMENT';
      document.getElementById('carouselPanel').style.background = t.color;

      document.getElementById('toggleCards').classList.add('toggle-active');
      document.getElementById('toggleCharts').classList.remove('toggle-active');
      document.getElementById('carouselBattle').style.display = '';
      document.getElementById('carouselCharts').style.display = 'none';

      renderCarouselAt();
      document.getElementById('battleSheet').style.display = '';
      document.body.style.overflow = 'hidden';
    }

    function prevCarousel() {
      carouselPosition = (carouselPosition - 1 + currentBattleRows.length) % currentBattleRows.length;
      renderCarouselAt();
    }

    function nextCarousel() {
      carouselPosition = (carouselPosition + 1) % currentBattleRows.length;
      renderCarouselAt();
    }

    function closeBattleSheet() {
      document.getElementById('battleSheet').style.display = 'none';
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeBattleSheet();
      if (document.getElementById('battleSheet').style.display !== 'none') {
        if (e.key === 'ArrowLeft') prevCarousel();
        if (e.key === 'ArrowRight') nextCarousel();
      }
    });

    // ── Auto-load on page load ─────────────────
    loadWallet();
  </script>
</body>
